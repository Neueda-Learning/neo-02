databaseChangeLog:
  - changeSet:
      id: 006-drop-demo-showcase
      author: neo-02
      changes:
        - dropTable:
            tableName: demo_showcase
      rollback:
        - createTable:
            tableName: demo_showcase
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
