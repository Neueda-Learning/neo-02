# Replace the old 26-row UC05 analytics corpus with five operator-facing examples.
# Four rows mirror the supplied Sidecar envelopes. example_05 is a generated clean policy path:
# Aisha Khan, GB resident, GB + IE tax residencies, no existing product or restriction match.
