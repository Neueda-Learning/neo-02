# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-policy-config.yaml
  - include:
      file: db/changelog/changes/003-create-policy-record.yaml
  - include:
      file: db/changelog/changes/004-create-override-log.yaml
  - include:
      file: db/changelog/changes/005-seed-policy-config-v1.yaml
  - include:
      file: db/changelog/changes/006-drop-demo-showcase.yaml
  - include:
      file: db/changelog/changes/007-add-applicant-full-name.yaml
  - include:
      file: db/changelog/changes/007-seed-uc05-reason-code-window.yaml
  - include:
      file: db/changelog/changes/008-refresh-uc05-seed-window.yaml
  - include:
      file: db/changelog/changes/009-replace-uc05-with-curated-applications.yaml
