<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Customer Policy — Data Flow</title>
  <desc id="desc">Application intake, asynchronous policy evaluation, persisted decision, orchestrator status update, and operations data flows.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 50px; font-weight: 750; fill: #0b3326; letter-spacing: -1px; }
      .subtitle { font-size: 24px; font-weight: 450; fill: #304d43; }
      .lane-title { font-size: 23px; font-weight: 750; fill: #0b3326; }
      .step-title { font-size: 18px; font-weight: 750; fill: #102f25; }
      .body { font-size: 16px; font-weight: 450; fill: #17372d; }
      .small { font-size: 14px; font-weight: 450; fill: #365247; }
      .micro { font-size: 12.5px; font-weight: 500; fill: #365247; }
      .endpoint { font-size: 15px; font-weight: 650; fill: #17372d; }
      .badge { font-size: 17px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .outcome { font-size: 19px; font-weight: 800; }
      .footer { font-size: 16px; font-weight: 650; fill: #17372d; }
      .card { fill: #fffefa; stroke: #174638; stroke-width: 1.6; }
      .soft-card { fill: #fbfcfa; stroke: #6d8b80; stroke-width: 1.1; }
      .lane { fill: #ffffff; stroke: #d7dfdb; stroke-width: 1.2; }
      .line { fill: none; stroke: #174638; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #174638; stroke-width: 2; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; }
      .read { fill: none; stroke: #287087; stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; stroke-linejoin: round; }
      .write { fill: none; stroke: #b85a08; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b3326" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#174638"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287087"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85a08"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#fbfaf7"/>

  <g class="sans">
    <text x="34" y="70" class="title">Customer Policy — Data Flow</text>
    <text x="36" y="112" class="subtitle">From application intake to persisted decision and status update</text>

    <!-- Swimlanes -->
    <rect x="24" y="150" width="1552" height="230" rx="10" class="lane"/>
    <rect x="24" y="400" width="1552" height="450" rx="10" class="lane"/>
    <rect x="24" y="870" width="1552" height="220" rx="10" class="lane"/>
    <path d="M 214 150 V 380 M 214 400 V 850 M 214 870 V 1090" stroke="#e0e6e2" stroke-width="1.2"/>
    <rect x="24" y="150" width="190" height="230" rx="10" fill="#f2f5f1"/>
    <rect x="24" y="400" width="190" height="450" rx="10" fill="#eef7f5"/>
    <rect x="24" y="870" width="190" height="220" rx="10" fill="#fbf4ee"/>

    <!-- Lane icons and labels -->
    <g stroke="#0b3326" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 70 216 L 118 184 L 166 216 Z M 80 222 V 274 M 104 222 V 274 M 132 222 V 274 M 156 222 V 274 M 70 280 H 166"/>
      <path d="M 118 488 C 145 503 161 503 161 503 V 554 C 161 594 118 617 118 617 C 118 617 75 594 75 554 V 503 C 75 503 91 503 118 488 Z M 98 550 L 113 565 L 141 532"/>
      <circle cx="118" cy="934" r="24"/>
      <path d="M 78 1010 C 83 975 96 963 118 963 C 140 963 153 975 158 1010 M 78 1010 Q 118 1022 158 1010"/>
    </g>
    <text x="118" y="318" class="lane-title" text-anchor="middle">Orchestrator</text>
    <text x="118" y="656" class="lane-title" text-anchor="middle">Customer Policy</text>
    <text x="118" y="1051" class="lane-title" text-anchor="middle">Operations UI</text>

    <!-- Step 1 -->
    <g filter="url(#shadow)">
      <rect x="250" y="205" width="260" height="120" rx="8" class="card"/>
    </g>
    <circle cx="278" cy="190" r="17" fill="#0b3326"/>
    <text x="278" y="190" class="badge">1</text>
    <text x="380" y="237" class="step-title" text-anchor="middle">Send application</text>
    <text x="380" y="269" class="endpoint" text-anchor="middle">POST /api/v1/applications</text>
    <text x="380" y="299" class="small" text-anchor="middle">Full application envelope</text>

    <!-- Step 3 -->
    <g filter="url(#shadow)">
      <rect x="585" y="205" width="260" height="100" rx="8" class="card"/>
    </g>
    <circle cx="613" cy="190" r="17" fill="#0b3326"/>
    <text x="613" y="190" class="badge">3</text>
    <text x="715" y="242" class="step-title" text-anchor="middle">202 Accepted</text>
    <text x="715" y="271" class="small" text-anchor="middle">Immediate response after commit</text>

    <!-- Registry -->
    <g filter="url(#shadow)">
      <rect x="920" y="215" width="225" height="80" rx="8" class="soft-card"/>
    </g>
    <circle cx="958" cy="255" r="18" fill="none" stroke="#174638" stroke-width="2"/>
    <path d="M 950 255 L 957 262 L 968 247" class="line"/>
    <text x="1048" y="247" class="step-title" text-anchor="middle">Registry</text>
    <text x="1048" y="273" class="small" text-anchor="middle">Existing product data</text>

    <!-- Step 6 -->
    <g filter="url(#shadow)">
      <rect x="1245" y="195" width="290" height="130" rx="8" class="card"/>
    </g>
    <circle cx="1273" cy="180" r="17" fill="#0b3326"/>
    <text x="1273" y="180" class="badge">6</text>
    <text x="1390" y="229" class="step-title" text-anchor="middle">Final status update</text>
    <text x="1390" y="262" class="endpoint" text-anchor="middle">PUT /api/v1/applications/{id}</text>
    <text x="1390" y="294" class="small" text-anchor="middle">ACCEPTED · REJECTED · REFERRED</text>

    <!-- Step 2 -->
    <g filter="url(#shadow)">
      <rect x="250" y="500" width="260" height="220" rx="10" fill="#f7fbfd" stroke="#287087" stroke-width="1.7"/>
    </g>
    <circle cx="278" cy="484" r="17" fill="#0b3326"/>
    <text x="278" y="484" class="badge">2</text>
    <text x="380" y="543" font-size="20" font-weight="800" fill="#195a71" text-anchor="middle">IN_PROGRESS</text>
    <text x="380" y="584" class="step-title" text-anchor="middle">Persist intake</text>
    <text x="380" y="617" class="body" text-anchor="middle">Create PolicyRecord</text>
    <text x="380" y="650" class="small" text-anchor="middle">Pin config version</text>
    <text x="380" y="674" class="small" text-anchor="middle">+ sampling position</text>
    <text x="380" y="704" class="micro" text-anchor="middle">Durable hand-off before response</text>

    <!-- Step 4 -->
    <g filter="url(#shadow)">
      <rect x="560" y="470" width="340" height="286" rx="12" fill="#f8fbfb" stroke="#287087" stroke-width="1.7"/>
    </g>
    <circle cx="588" cy="454" r="17" fill="#0b3326"/>
    <text x="588" y="454" class="badge">4</text>
    <text x="730" y="511" class="step-title" text-anchor="middle">Evaluate policy rules</text>
    <text x="730" y="539" class="small" text-anchor="middle">Asynchronous worker</text>

    <g>
      <rect x="582" y="558" width="296" height="39" rx="7" class="soft-card"/>
      <rect x="582" y="603" width="296" height="39" rx="7" class="soft-card"/>
      <rect x="582" y="648" width="296" height="39" rx="7" class="soft-card"/>
      <rect x="582" y="693" width="296" height="39" rx="7" class="soft-card"/>
      <circle cx="608" cy="577" r="9" fill="none" stroke="#174638" stroke-width="1.8"/>
      <path d="M 596 589 C 599 580 617 580 620 589" class="line"/>
      <circle cx="608" cy="622" r="11" fill="none" stroke="#174638" stroke-width="1.8"/>
      <path d="M 598 622 H 618 M 608 611 C 603 616 603 628 608 633 M 608 611 C 613 616 613 628 608 633" class="line" stroke-width="1.2"/>
      <rect x="598" y="656" width="20" height="23" rx="2" fill="none" stroke="#174638" stroke-width="1.8"/>
      <path d="M 603 662 H 613 M 603 668 H 613 M 603 674 H 609" class="line" stroke-width="1.3"/>
      <path d="M 598 722 V 710 M 605 722 V 704 M 612 722 V 714 M 619 722 V 699" class="line" stroke-width="2.2"/>
      <text x="634" y="583" class="body">Existing Product Check</text>
      <text x="634" y="628" class="body">Tax Residency Check</text>
      <text x="634" y="673" class="body">Restriction List Check</text>
      <text x="634" y="718" class="body">Sampling Rule</text>
    </g>

    <!-- Step 5 outcomes -->
    <circle cx="970" cy="454" r="17" fill="#0b3326"/>
    <text x="970" y="454" class="badge">5</text>

    <g filter="url(#shadow)">
      <rect x="970" y="476" width="240" height="78" rx="9" fill="#eff7ef" stroke="#3c8b48" stroke-width="1.6"/>
      <rect x="970" y="586" width="240" height="78" rx="9" fill="#fff1f0" stroke="#c72c28" stroke-width="1.6"/>
      <rect x="970" y="696" width="240" height="78" rx="9" fill="#fff6eb" stroke="#d36a09" stroke-width="1.6"/>
    </g>
    <circle cx="1003" cy="515" r="17" fill="none" stroke="#2d7c3d" stroke-width="2"/>
    <path d="M 995 515 L 1001 521 L 1012 506" fill="none" stroke="#2d7c3d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1003" cy="625" r="17" fill="none" stroke="#c72c28" stroke-width="2"/>
    <path d="M 996 618 L 1010 632 M 1010 618 L 996 632" fill="none" stroke="#c72c28" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1000" cy="735" r="9" fill="none" stroke="#d36a09" stroke-width="2"/>
    <circle cx="1017" cy="735" r="9" fill="none" stroke="#d36a09" stroke-width="2"/>
    <path d="M 988 754 C 990 742 1008 742 1010 754 M 1008 754 C 1010 742 1028 742 1030 754" fill="none" stroke="#d36a09" stroke-width="2" stroke-linecap="round"/>
    <text x="1088" y="509" class="outcome" fill="#2d7c3d" text-anchor="middle">APPROVED</text>
    <text x="1088" y="536" class="micro" text-anchor="middle">All checks pass; not sampled</text>
    <text x="1088" y="619" class="outcome" fill="#c72c28" text-anchor="middle">REJECTED</text>
    <text x="1088" y="646" class="micro" text-anchor="middle">Any business rule fails</text>
    <text x="1088" y="729" class="outcome" fill="#d36a09" text-anchor="middle">REFERRED</text>
    <text x="1088" y="756" class="micro" text-anchor="middle">Sampled or Registry unavailable</text>

    <!-- MySQL -->
    <g filter="url(#shadow)">
      <path d="M 590 795 C 590 778 870 778 870 795 V 826 C 870 843 590 843 590 826 Z" fill="#fffefa" stroke="#174638" stroke-width="1.6"/>
      <ellipse cx="730" cy="795" rx="140" ry="17" fill="#f1f6f3" stroke="#174638" stroke-width="1.6"/>
    </g>
    <text x="730" y="818" class="step-title" text-anchor="middle">MySQL</text>
    <text x="730" y="838" class="micro" text-anchor="middle">Policy records · config versions</text>

    <!-- Primary connectors -->
    <path d="M 380 325 V 500" class="line" marker-end="url(#arrow-green)"/>
    <path d="M 380 500 V 358 H 715 V 305" class="dash" marker-end="url(#arrow-green)"/>
    <text x="510" y="349" class="small" fill="#0b3326">Commit, then acknowledge</text>
    <path d="M 510 610 H 560" class="dash" marker-end="url(#arrow-green)"/>
    <text x="535" y="596" class="micro" text-anchor="middle">After commit</text>
    <path d="M 730 470 V 420 H 1032 V 295" class="read" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text x="854" y="410" class="small" fill="#287087">Registry lookup</text>
    <path d="M 730 778 V 756" class="read" marker-end="url(#arrow-blue)"/>
    <text x="748" y="772" class="micro" fill="#287087">Policy Config</text>
    <path d="M 900 615 H 938 M 938 515 V 735" class="line"/>
    <path d="M 938 515 H 970 M 938 625 H 970 M 938 735 H 970" class="line" marker-end="url(#arrow-green)"/>

    <!-- Intake and outcome persistence -->
    <path d="M 380 720 V 812 H 590" class="write" marker-end="url(#arrow-orange)"/>
    <text x="397" y="802" class="micro" fill="#b85a08">INSERT PolicyRecord</text>
    <path d="M 1088 774 V 830 H 870" class="write" marker-end="url(#arrow-orange)"/>
    <text x="984" y="822" class="micro" fill="#b85a08" text-anchor="middle">Decision + rule results + reason codes</text>

    <!-- Outcome callbacks -->
    <path d="M 1210 515 H 1318 V 325" class="line" marker-end="url(#arrow-green)"/>
    <path d="M 1210 625 H 1390 V 325" class="line" marker-end="url(#arrow-green)"/>
    <path d="M 1210 735 H 1462 V 325" class="write" marker-end="url(#arrow-orange)"/>

    <!-- Step 7 -->
    <g filter="url(#shadow)">
      <rect x="250" y="925" width="330" height="115" rx="9" class="card"/>
    </g>
    <circle cx="278" cy="910" r="17" fill="#0b3326"/>
    <text x="278" y="910" class="badge">7</text>
    <text x="415" y="961" class="step-title" text-anchor="middle">Search &amp; inspect cases</text>
    <text x="415" y="991" class="endpoint" text-anchor="middle">GET /api/v1/cases</text>
    <text x="415" y="1019" class="small" text-anchor="middle">Read-only</text>

    <!-- Step 8 -->
    <g filter="url(#shadow)">
      <rect x="635" y="925" width="330" height="115" rx="9" class="card"/>
    </g>
    <circle cx="663" cy="910" r="17" fill="#0b3326"/>
    <text x="663" y="910" class="badge">8</text>
    <text x="800" y="961" class="step-title" text-anchor="middle">View applicant</text>
    <text x="800" y="991" class="body" text-anchor="middle">Fetched live from Orchestrator</text>
    <text x="800" y="1019" class="small" text-anchor="middle">Payload not duplicated</text>

    <!-- Step 9 -->
    <g filter="url(#shadow)">
      <rect x="1020" y="925" width="330" height="115" rx="9" fill="#fffaf4" stroke="#b85a08" stroke-width="1.6"/>
    </g>
    <circle cx="1048" cy="910" r="17" fill="#0b3326"/>
    <text x="1048" y="910" class="badge">9</text>
    <text x="1185" y="961" class="step-title" text-anchor="middle">Publish policy config</text>
    <text x="1185" y="991" class="endpoint" text-anchor="middle">POST /config</text>
    <text x="1185" y="1019" class="small" text-anchor="middle">Insert new version</text>

    <!-- Operations data connectors -->
    <path d="M 415 925 V 860 H 650 V 843" class="read" marker-end="url(#arrow-blue)"/>
    <text x="490" y="878" class="micro" fill="#287087">Read cases and decisions</text>
    <path d="M 1185 925 V 860 H 810 V 843" class="write" marker-end="url(#arrow-orange)"/>
    <text x="1004" y="878" class="micro" fill="#b85a08" text-anchor="middle">Append configuration version</text>

    <!-- Footer strip -->
    <rect x="24" y="1110" width="1552" height="70" rx="10" fill="#f5f7f5" stroke="#d7dfdb" stroke-width="1.2"/>
    <path d="M 540 1122 V 1168 M 1050 1122 V 1168" stroke="#cdd7d2" stroke-width="1.2"/>
    <g stroke="#0b3326" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="72" cy="1136" rx="22" ry="8"/>
      <path d="M 50 1136 V 1155 C 50 1166 94 1166 94 1155 V 1136 M 50 1146 C 50 1157 94 1157 94 1146"/>
      <circle cx="585" cy="1144" r="17"/>
      <path d="M 597 1156 L 610 1169 M 577 1144 L 584 1151 L 595 1137"/>
      <rect x="1094" y="1127" width="34" height="38" rx="3"/>
      <path d="M 1102 1138 H 1120 M 1102 1147 H 1120 M 1102 1156 H 1114"/>
    </g>
    <text x="116" y="1152" class="footer">Durable decisions live in MySQL</text>
    <text x="628" y="1152" class="footer">Applicant details are fetched live when needed</text>
    <text x="1145" y="1152" class="footer">Policy config is append-only and versioned</text>
  </g>
</svg>
